<!DOCTYPE html>
<html>

<head>
    <title>Registration Page</title>
    

<style>
    body {
        font-family: Arial, sans-serif;
        color: darkblue;
        background-color: #F8F5EF;
    }

    h2 {
        font-family: Georgia, serif;
        color: #243447;
        text-align: center;
        background-color: #DCEAF2;
        padding: 10px;
    }

    table {
        background-color: white;
        border: 1px solid #CBD5E1;
        margin: auto;
        padding: 5px;
    }

    td {
        color: #243447;
        font-size: 18px;
        padding: 4px;
    }

    input[type="text"],
    input[type="password"] {
        padding: 6px;
        border: 1px solid #CBD5E1;
    }

    input[type="submit"] {
        background-color: #355E52;
        color: white;
        padding: 8px 16px;
        border: none;
        cursor: pointer;
    }

    input[type="reset"] {
        background-color: #E6C98B;
        color: #243447;
        padding: 8px 16px;
        border: none;
        cursor: pointer;
    }

    input[type="submit"]:hover {
        background-color: #243447;
    }

    input[type="reset"]:hover {
        background-color: #D6B875;
    }
</style>


<style>
body {
    background-repeat: no-repeat;
    background-position: center;
}

a:link {
    color: blue;
    text-decoration: none;
}

a:visited {
    color: purple;
}

a:active {
    color: red;
}

a:hover {
    color: green;
    text-decoration: underline;
}
</style>
</head>

<body>

    <h2 align="center">Registration Page</h2>

    <form>

        <table align="center" cellpadding="8">

            <tr>
                <td>Name:</td>
                <td>
                    <input type="text" name="name">
                </td>
            </tr>

            <tr>
                <td>Password:</td>
                <td>
                    <input type="password" name="password">
                </td>
            </tr>

            <tr>
                <td>E-mail:</td>
                <td>
                    <input type="text" name="email">
                </td>
            </tr>

            <tr>
                <td>Phone Number:</td>
                <td>
                    <input type="text" name="phone">
                </td>
            </tr>

            <tr>
                <td>Sex:</td>
                <td>
                    <input type="radio" name="sex" value="male"> Male
                    <input type="radio" name="sex" value="female"> Female
                </td>
            </tr>

            <tr>
                <td>Date of Birth:</td>
                <td>

                    <select name="day">
                        <option>Day</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option>10</option>
                        <option>11</option>
                        <option>12</option>
                        <option>13</option>
                        <option>14</option>
                        <option>15</option>
                        <option>16</option>
                        <option>17</option>
                        <option>18</option>
                        <option>19</option>
                        <option>20</option>
                        <option>21</option>
                        <option>22</option>
                        <option>23</option>
                        <option>24</option>
                        <option>25</option>
                        <option>26</option>
                        <option>27</option>
                        <option>28</option>
                        <option>29</option>
                        <option>30</option>
                        <option>31</option>
                    </select>

                    <select name="month">
                        <option>Month</option>
                        <option>January</option>
                        <option>February</option>
                        <option>March</option>
                        <option>April</option>
                        <option>May</option>
                        <option>June</option>
                        <option>July</option>
                        <option>August</option>
                        <option>September</option>
                        <option>October</option>
                        <option>November</option>
                        <option>December</option>
                    </select>

                    <select name="year">
                        <option>Year</option>
                        <option>2000</option>
                        <option>2001</option>
                        <option>2002</option>
                        <option>2003</option>
                        <option>2004</option>
                        <option>2005</option>
                        <option>2006</option>
                        <option>2007</option>
                        <option>2008</option>
                        <option>2009</option>
                        <option>2010</option>
                    </select>

                </td>
            </tr>

            <tr>
                <td>Languages Known:</td>
                <td>
                    <input type="checkbox" name="language" value="English">
                    English

                    <input type="checkbox" name="language" value="Telugu">
                    Telugu

                    <input type="checkbox" name="language" value="Hindi">
                    Hindi

                    <input type="checkbox" name="language" value="Tamil">
                    Tamil
                </td>
            </tr>

            <tr>
                <td>Address:</td>
                <td>
                    <textarea name="address" rows="5" cols="30"></textarea>
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Register">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

</body>

</html>
