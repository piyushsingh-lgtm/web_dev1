<!DOCTYPE html>
<html>

<head>
    <title>Login Page</title>
</head>

<body>

    <h2 align="center">Login Page</h2>

    <form>

        <table align="center">

            <tr>
                <td>User Name:</td>
                <td>
                    <input type="text" name="username">
                </td>
            </tr>

            <tr>
                <td>Password:</td>
                <td>
                    <input type="password" name="password">
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

</body>

</html>
