<style>
    body {
        font-family: Arial, sans-serif;
        color: darkblue;

    h2 {
        font-family: Georgia, serif;
        color: darkred;
        text-align: center;

    }

    table {
        background-color: white;
        border: 2px solid black;
    }

body {
