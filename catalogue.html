<!DOCTYPE html>
<html>

<head>
    <title>Book Catalogue</title>
</head>

<body>

    <h2 align="center">Book Catalogue</h2>

    <table border="1" width="100%" cellpadding="10">

        <tr>
            <th>Book</th>
            <th>Book Details</th>
            <th>Price</th>
            <th>Action</th>
        </tr>

        <tr>
            <td align="center">
                <img src="xml.jpg" width="100" height="120">
            </td>

            <td>
                <b>XML Bible</b><br>
                Author: Elliotte Rusty Harold<br>
                Publisher: Wiley
            </td>

            <td align="center">
                $40.5
            </td>

            <td align="center">
                <button>Add to Cart</button>
            </td>
        </tr>

        <tr>
            <td align="center">
                <img src="ai.jpg" width="100" height="120">
            </td>

            <td>
                <b>Artificial Intelligence</b><br>
                Author: Stuart Russell<br>
                Publisher: Pearson
            </td>

            <td align="center">
                $63
            </td>

            <td align="center">
                <button>Add to Cart</button>
            </td>
        </tr>

        <tr>
            <td align="center">
                <img src="java.jpg" width="100" height="120">
            </td>

            <td>
                <b>Java Programming</b><br>
                Author: Herbert Schildt<br>
                Publisher: McGraw Hill
            </td>

            <td align="center">
                $45
            </td>

            <td align="center">
                <button>Add to Cart</button>
            </td>
        </tr>

    </table>

</body>

</html>
