<!DOCTYPE html>
<html>

<head>
    <title>Cart Page</title>
</head>


<style>
    body {
        font-family: Arial, sans-serif;
        color: darkblue;
        background-color: #F8F5EF;
    }

    h2 {
        font-family: Georgia, serif;
        color: #243447;
        text-align: center;
        background-color: #DCEAF2;
        padding: 10px;
    }

    table {
        background-color: white;
        border: 1px solid #CBD5E1;
        margin: auto;
        padding: 5px;
    }

    td {
        color: #243447;
        font-size: 18px;
        padding: 4px;
    }

    input[type="text"],
    input[type="password"] {
        padding: 6px;
        border: 1px solid #CBD5E1;
    }

    input[type="submit"] {
        background-color: #355E52;
        color: white;
        padding: 8px 16px;
        border: none;
        cursor: pointer;
    }

    input[type="reset"] {
        background-color: #E6C98B;
        color: #243447;
        padding: 8px 16px;
        border: none;
        cursor: pointer;
    }

    input[type="submit"]:hover {
        background-color: #243447;
    }

    input[type="reset"]:hover {
        background-color: #D6B875;
    }
</style>


<style>
body {
    background-repeat: no-repeat;
    background-position: center;
}

a:link {
    color: blue;
    text-decoration: none;
}

a:visited {
    color: purple;
}

a:active {
    color: red;
}

a:hover {
    color: green;
    text-decoration: underline;
}
</style>

<body>

    <h2 align="center">Cart Page</h2>

    <table border="1" width="100%" cellpadding="10">

        <tr>
            <th>Book Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Amount</th>
        </tr>

        <tr>
            <td>Introduction to Algorithms</td>
            <td>$35.5</td>
            <td>2</td>
            <td>$70</td>
        </tr>

        <tr>
            <td>Artificial Intelligence: A Modern Approach</td>
            <td>$40.5</td>
            <td>1</td>
            <td>$40.5</td>
        </tr>

        <tr>
            <td><b>Total Amount</b></td>
            <td>-</td>
            <td>-</td>
            <td><b>$130.5</b></td>
        </tr>

    </table>

</body>

</html>
