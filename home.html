
<!DOCTYPE html>
<html>
<head>
    <title>Home</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            color: darkblue;
            background-color: lightyellow;
            background-image: url("background.jpg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        h2 {
            font-family: Georgia, serif;
            color: darkred;
            text-align: center;
            background-color: lightblue;
            padding: 15px;
        }

        p {
            font-family: Verdana, sans-serif;
            font-size: 18px;
            color: darkgreen;
            background-color: white;
            padding: 15px;
            border: 2px solid navy;
        }

        a:link {
            color: blue;
        }

        a:visited {
            color: purple;
        }

        a:hover {
            color: green;
        }

        a:active {
            color: red;
        }
    </style>
</head>

<body>
    <h2>Welcome to Online Book Store</h2>

    <p>
        This website provides books for different engineering departments.
        Click on any branch from the left side to view the available books.
    </p>

</html>
