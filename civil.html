<!DOCTYPE html>
<html>
<head>
    <title>Civil Engineering Books</title>
</head>


<style>
    body {
        font-family: Arial, sans-serif;
        color: darkblue;
        background-color: #F8F5EF;
    }

    h2 {
        font-family: Georgia, serif;
        color: #243447;
        text-align: center;
        background-color: #DCEAF2;
        padding: 10px;
    }

    table {
        background-color: white;
        border: 1px solid #CBD5E1;
        margin: auto;
        padding: 5px;
    }

    td {
        color: #243447;
        font-size: 18px;
        padding: 4px;
    }

    input[type="text"],
    input[type="password"] {
        padding: 6px;
        border: 1px solid #CBD5E1;
    }

    input[type="submit"] {
        background-color: #355E52;
        color: white;
        padding: 8px 16px;
        border: none;
        cursor: pointer;
    }

    input[type="reset"] {
        background-color: #E6C98B;
        color: #243447;
        padding: 8px 16px;
        border: none;
        cursor: pointer;
    }

    input[type="submit"]:hover {
        background-color: #243447;
    }

    input[type="reset"]:hover {
        background-color: #D6B875;
    }
</style>


<style>
body {
    background-repeat: no-repeat;
    background-position: center;
}

a:link {
    color: blue;
    text-decoration: none;
}

a:visited {
    color: purple;
}

a:active {
    color: red;
}

a:hover {
    color: green;
    text-decoration: underline;
}
</style>
<body>

<h2>Popular Civil Engineering Books</h2>

<ul>
    <li>Structural Analysis by R.C. Hibbeler</li>
    <li>Concrete Technology by M.S. Shetty</li>
    <li>Soil Mechanics and Foundations by B.C. Punmia</li>
    <li>Fluid Mechanics by R.K. Bansal</li>
</ul>

</body>
</html>
